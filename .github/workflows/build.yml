name: Сборка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Конвертер fb2cng (официальная сборка)
        run: python tools/get_fbc.py fbc windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Тесты
        run: python -m pytest -v tests --ignore=tests/test_network.py
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts

      - name: Интернет — Википедия и GitHub (не блокирует сборку)
        continue-on-error: true
        run: python -m pytest -v -s tests/test_network.py

      - name: Сборка exe
        shell: pwsh
        run: |
          $ver = python tools/make_version_info.py
          "VERSION=$ver" >> $env:GITHUB_ENV
          python -m PyInstaller --noconfirm FB2Kindle.spec

      - name: Проверка exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: |
          Copy-Item -Recurse fbc "dist/FB2 Kindle/fbc"
          Copy-Item assets/fb2cng-LICENSE.txt "dist/FB2 Kindle/fbc/LICENSE.txt"
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $shot = Join-Path $PWD "screenshots/11-exe.png"
          $p = Start-Process -FilePath "dist/FB2 Kindle/FB2 Kindle.exe" -ArgumentList "--screenshot", "`"$shot`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "exe не завершился" }
          if (-not (Test-Path $shot)) { throw "exe не запустился" }
          "{0:N1} МБ" -f ((Get-ChildItem -Recurse "dist/FB2 Kindle" | Measure-Object Length -Sum).Sum / 1MB)

      - name: Проверка обновления изнутри программы
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: |
          $base = "C:\t\Мои программы"
          $old = Join-Path $base "FB2 Kindle"
          $new = "C:\t\new\FB2 Kindle"
          New-Item -ItemType Directory -Force $base, (Split-Path $new) | Out-Null
          Copy-Item -Recurse "dist/FB2 Kindle" $old
          Copy-Item -Recurse "dist/FB2 Kindle" $new
          "новая версия" | Out-File -Encoding utf8 (Join-Path $new "UPDATED.txt")
          Compress-Archive -Path $new -DestinationPath "C:\t\upd.zip"
          $p = Start-Process -FilePath (Join-Path $old "FB2 Kindle.exe") -ArgumentList "--apply-update", "C:\t\upd.zip" -PassThru
          if (-not $p.WaitForExit(60000)) { throw "программа не закрылась для обновления" }
          for ($i = 0; $i -lt 90 -and -not (Test-Path (Join-Path $old "UPDATED.txt")); $i++) { Start-Sleep 1 }
          if (-not (Test-Path (Join-Path $old "UPDATED.txt"))) {
            Get-Content "$env:TEMP\FB2Kindle-update\update-error.log" -ErrorAction SilentlyContinue
            throw "обновление не установилось"
          }
          $r = $null
          for ($i = 0; $i -lt 30 -and -not $r; $i++) { Start-Sleep 1; $r = Get-Process "FB2 Kindle" -ErrorAction SilentlyContinue }
          if (-not $r) { throw "после обновления программа не запустилась" }
          "Обновление установлено, программа перезапущена: $($r.Path)"
          $r | Stop-Process -Force

      - name: Самые большие файлы сборки
        shell: pwsh
        run: Get-ChildItem -Recurse "dist/FB2 Kindle" -File | Sort-Object Length -Descending | Select-Object -First 25 | ForEach-Object { "{0,8:N1} МБ  {1}" -f ($_.Length / 1MB), $_.FullName.Substring($PWD.Path.Length) }

      - name: Снимки экрана в журнал
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem screenshots/*.png | ForEach-Object {
            "=====SHOT $($_.Name)"
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b.Length; $i += 4000) { $b.Substring($i, [Math]::Min(4000, $b.Length - $i)) }
            "=====END"
          }

      - name: Архив
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE "dist/FB2 Kindle/"
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "dist/FB2 Kindle" -DestinationPath "release/FB2-Kindle-$env:VERSION-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FB2-Kindle-${{ env.VERSION }}-windows
          path: release/*.zip
          retention-days: 30

      - name: Настоящее обновление с 2.1.0, возврат и сохранность истории
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: |
          gh release download v2.1.0 --repo Chartedkey/FB2-to-Kindle --pattern "FB2-Kindle-2.1.0-windows.zip" --dir previous-release
          if ($LASTEXITCODE -ne 0) { throw "Не удалось скачать исходный выпуск 2.1.0" }
          python tools/check_windows_upgrade.py --old-zip "previous-release/FB2-Kindle-2.1.0-windows.zip" --new-zip "release/FB2-Kindle-$env:VERSION-windows.zip" --work-dir "$env:RUNNER_TEMP/FB2-upgrade-check" --report "screenshots/upgrade-report.json"
          if ($LASTEXITCODE -ne 0) { throw "Проверка обновления и возврата не пройдена" }
          gh release download v2.2.0 --repo Chartedkey/FB2-to-Kindle --pattern "FB2-Kindle-2.2.0-windows.zip" --dir previous-release
          if ($LASTEXITCODE -ne 0) { throw "Не удалось скачать выпуск 2.2.0" }
          python tools/check_windows_catalog_upgrade.py --old-zip "previous-release/FB2-Kindle-2.2.0-windows.zip" --new-zip "release/FB2-Kindle-$env:VERSION-windows.zip" --work-dir "$env:RUNNER_TEMP/FB2-catalog-upgrade-check" --report "screenshots/catalog-upgrade-report.json"
          if ($LASTEXITCODE -ne 0) { throw "Прогресс каталога не пережил обновление с 2.2.0" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      - name: Выпуск (когда в src/fb2kindle/__init__.py новая версия)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { "Выпуск $tag уже есть — пропускаю"; exit 0 }
          $notes = "CHANGELOG/$tag.md"
          if (Test-Path $notes) {
            gh release create $tag release/*.zip --target $env:GITHUB_SHA --title "FB2 → Kindle $env:VERSION" --notes-file $notes
          } else {
            gh release create $tag release/*.zip --target $env:GITHUB_SHA --title "FB2 → Kindle $env:VERSION" --generate-notes
          }
